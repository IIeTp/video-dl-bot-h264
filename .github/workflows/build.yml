name: build-and-publish

# Builds upstream tarampampam/video-dl-bot from source, applies our patches on top, and
# publishes the result. Upstream is always fetched fresh, so every upstream change flows
# through; only the lines our patches touch are ours. If upstream moves those lines, the
# patch no longer applies and the build fails loudly instead of silently dropping the fix.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Serialise runs: overlapping jobs fight over the runner tool caches.
concurrency:
  group: build-and-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/iietp/video-dl-bot-h264
  UPSTREAM: tarampampam/video-dl-bot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Our repository: patches + workflow + ci only, no upstream source.
      - uses: actions/checkout@v7

      - name: Check out upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: src

      # Gate: a patch that no longer applies fails here, before anything is built or published.
      - name: Apply patches
        working-directory: src
        run: |
          set -euo pipefail
          for patch in ../patches/*.patch; do
            echo "::group::applying ${patch}"
            git apply --3way --verbose "${patch}"
            echo "::endgroup::"
          done

      # Gate: the applied source really contains what the patch promises.
      - name: Verify patched source
        working-directory: src
        run: |
          set -euo pipefail
          grep -q 'Streaming: true' internal/bot/bot.go
          grep -q 'func parseResolution' internal/bot/bot.go
          echo "OK: sendVideo streaming metadata is present in the patched source"

      - name: Record applied revisions
        id: rev
        working-directory: src
        run: |
          set -euo pipefail
          echo "upstream_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # cache-image: the binfmt image lives in the runner tool cache already, and its Actions
      # cache key is repository-wide, so saving it only races other runs.
      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN can push only while the package inherits write access from this repository.
      # Flipping the package visibility to public drops that inheritance, so a classic PAT
      # (scope: write:packages) stored as the GHCR_PAT secret is used when it exists.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          # APP_VERSION stamps the binary; upstream Dockerfile forwards it to -ldflags
          build-args: |
            APP_VERSION=${{ steps.rev.outputs.upstream_sha }}@ghcr
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:upstream-${{ steps.rev.outputs.upstream_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate 1: the image runs and the bot starts (upstream entrypoint untouched).
      - name: Smoke test - bot runs
        run: docker run --rm "$IMAGE:latest" --version

      # Gate 2: binary carries upstream's standard selector (and no codec override), bot runs.
      - name: Smoke test - image contract (offline)
        run: |
          docker run --rm -v "$PWD/ci:/ci:ro" --entrypoint /bin/sh "$IMAGE:latest" /ci/check-patched-bot.sh --offline

      # Informational: what the standard selector picks for a real URL. Needs YouTube from the
      # runner; asserts nothing about the codec, because format selection stays with upstream.
      - name: Smoke test - resolution report (network)
        id: resolve
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD/ci:/ci:ro" --entrypoint /bin/sh "$IMAGE:latest" /ci/check-patched-bot.sh

      - name: Report inconclusive resolution report
        if: steps.resolve.outcome != 'success'
        run: |
          echo "::warning::The resolution report did not run (usually YouTube unreachable from the runner). The gates above passed, so the image is intact."