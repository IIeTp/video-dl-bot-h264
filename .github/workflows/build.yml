name: build-and-publish

# Re-based on the newest upstream image on every push, daily (cron) and on demand.
# Content-addressed layers mean an unchanged upstream produces an unchanged image,
# so a daily run is a cheap no-op unless upstream actually published something new.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Serialise runs: overlapping jobs fight over the runner tool caches
# ("Unable to reserve cache with key docker.io--tonistiigi--binfmt-...").
concurrency:
  group: build-and-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # container registry paths must be lowercase; github.repository preserves the case of the owner
  IMAGE: ghcr.io/iietp/video-dl-bot-h264

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # All actions are pinned to majors that run on Node 24 (Node 20 is deprecated).
      - uses: actions/checkout@v7

      # cache-image: the binfmt image lives in the runner's tool cache already, and the
      # Actions cache key for it is repository-wide, so saving it only races other runs
      # ("Unable to reserve cache with key docker.io--tonistiigi--binfmt-...").
      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN can push only while the package inherits write access from this repository.
      # Flipping the package visibility to public drops that inheritance, so a classic PAT
      # (scope: write:packages) stored as the GHCR_PAT secret is used when it exists.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve upstream base digest
        id: base
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect ghcr.io/tarampampam/video-dl-bot:latest --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "upstream base digest: ${digest}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate 1: the wrapper must keep the bot runnable (entrypoint -> shim -> exec bot).
      - name: Smoke test - entrypoint chain
        run: docker run --rm "$IMAGE:latest" --version

      # Gate 2: deterministic contract - shim wins the PATH lookup and injects the selector.
      # This is what breaks visibly if upstream ever stops using exec.LookPath / last-format-wins.
      - name: Smoke test - shim contract (offline)
        run: |
          docker run --rm -e BOT_BINARY=/bin/sh -v "$PWD/ci:/ci:ro" \
            "$IMAGE:latest" /ci/check-h264.sh --offline

      # Gate 3: real resolution must yield mp4/H.264/AAC. Needs YouTube reachable from the
      # runner; reported as a warning (not a failure) when it is not, so that a blocked
      # datacenter IP cannot fail an otherwise good build - but it can never pass silently.
      - name: Smoke test - H.264 resolution (network)
        id: h264
        continue-on-error: true
        run: |
          docker run --rm -e BOT_BINARY=/bin/sh -v "$PWD/ci:/ci:ro" \
            "$IMAGE:latest" /ci/check-h264.sh

      - name: Report inconclusive H.264 check
        if: steps.h264.outcome != 'success'
        run: |
          echo "::warning::H.264 resolution check did not pass (usually YouTube unreachable from the runner). Offline contract gate passed, so the wrapper is intact - re-check manually before trusting the new image."
