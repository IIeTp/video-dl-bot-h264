name: build-and-publish

# Re-based on the newest upstream image on every push, daily (cron) and on demand.
# Content-addressed layers mean an unchanged upstream produces an unchanged image,
# so the daily run is a cheap no-op unless upstream actually published something new.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # container registry paths must be lowercase; github.repository preserves the case of the owner
  IMAGE: ghcr.io/iietp/video-dl-bot-h264

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream base digest
        id: base
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect ghcr.io/tarampampam/video-dl-bot:latest --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "upstream base digest: ${digest}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate 1: the wrapper must keep the bot runnable (entrypoint -> shim -> exec bot).
      - name: Smoke test - entrypoint chain
        run: docker run --rm "$IMAGE:latest" --version

      # Gate 2: the shim must be the yt-dlp the bot finds (PATH order survived upstream).
      - name: Smoke test - shim is first in PATH
        run: |
          set -euo pipefail
          out="$(docker run --rm -e BOT_BINARY=/bin/sh "$IMAGE:latest" -c 'command -v yt-dlp')"
          echo "$out"
          echo "$out" | grep -qx '/tmp/yt-dlp-shim/yt-dlp'

      # Gate 3: the forced selector must really produce H.264/mp4. Needs YouTube from the
      # runner; when it is unreachable the check is reported but does not block the build.
      - name: Smoke test - H.264 selection
        continue-on-error: true
        run: |
          docker run --rm -e BOT_BINARY=/bin/sh -v "$PWD/ci:/ci:ro" "$IMAGE:latest" /bin/sh /ci/check-h264.sh
